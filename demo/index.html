<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigitalMatrix Demo</title>
    <style>
      html,
      body,
      #matrix {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main id="matrix" aria-label="Animated digital matrix"></main>
    <script src="./vendor/p5.min.js"></script>
    <script src="./umd/digitalmatrix.min.js"></script>
    <script>
      const matrix = new DigitalMatrix("matrix");
      matrix.startPulsate();
      window.addEventListener("resize", () => matrix.resize());
    </script>
  </body>
</html>
